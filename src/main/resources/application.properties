spring.application.name=grupo2
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/foodgest}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
springdoc.swagger-ui.path=/swagger-ui.html
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# El valor por defecto solo sirve para desarrollo local: este archivo esta en un
# repo publico, asi que en cualquier despliegue real hay que setear JWT_SECRET
# (y CULQI_WEBHOOK_SECRET, DB_PASSWORD) como variables de entorno del servidor,
# nunca dejarlos en el valor por defecto de aqui.
jwt.secret=${JWT_SECRET:Zm9vZGdlc3Qtc2VjdXJlLXNlY3JldC1rZXkta2V5MTIzNA==}
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=604800000
culqi.webhook.secret=${CULQI_WEBHOOK_SECRET:dummy_webhook_secret}

# SOLO PARA DEMOS EN VIVO: si esta en true, un registro nuevo queda activo e
# inicia sesion de inmediato (en vez de quedar 'pendiente' esperando aprobacion
# manual). Dejar en false salvo que estes mostrando el proyecto en clase.
foodgest.demo.auto-activar-registro=${DEMO_AUTO_ACTIVAR:false}

# Correo SMTP real. Activalo con MAIL_ENABLED=true cuando tengas credenciales SMTP.
foodgest.mail.enabled=${MAIL_ENABLED:false}
foodgest.mail.from=${MAIL_FROM:no-reply@foodgest.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
