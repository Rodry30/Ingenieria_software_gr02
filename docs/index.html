<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FoodGest Wiki Técnica</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Wiki técnica del proyecto FoodGest - Plataforma agrícola digital B2B/B2C en Perú">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #2e7d32; /* Verde agrícola premium */
      --text-color-base: #37474f;
    }
    .markdown-section {
      max-width: 85%;
    }
    /* Estilos personalizados para alertas de GitHub en Docsify */
    blockquote {
      border-left: 4px solid var(--theme-color);
      background-color: #f1f8e9;
      padding: 10px 15px;
      color: #2e7d32;
    }
  </style>
</head>
<body>
  <div id="app">Cargando la wiki de FoodGest...</div>
  <script>
    window.$docsify = {
      name: 'FoodGest Wiki',
      repo: 'Rodry30/Ingenieria_software_gr02',
      loadSidebar: true,
      subMaxLevel: 3,
      coverpage: false,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Buscar en la wiki...',
        noData: 'Sin resultados',
        depth: 6
      },
      plugins: [
        function(hook, vm) {
          // Plugin personalizado para footer simple
          hook.afterEach(function(html) {
            var footer = [
              '<hr/>',
              '<footer>',
              '<span>&copy; 2026 Grupo 2 - Ingeniería de Software. Universidad Nacional Mayor de San Marcos.</span>',
              '</footer>'
            ].join('');
            return html + footer;
          });
        }
      ]
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Plugins adicionales -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Soporte para Mermaid -->
  <script src="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: true });
    // Integración de Mermaid con Docsify
    window.onload = function() {
      var num = 0;
      window.$docsify.markdown = {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              return (
                '<div class="mermaid">' + mermaid.render('mermaid-svg-' + num++, code) + "</div>"
              );
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      };
    };
  </script>
</body>
</html>
